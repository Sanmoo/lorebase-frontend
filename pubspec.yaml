name: lorebase
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.3

  # HTTP
  dio: ^5.4.0
  http_parser: ^4.0.2

  # Media
  image_picker: ^1.1.2

  # Auth
  amplify_flutter: ^2.0.0
  amplify_auth_cognito: ^2.0.0

  # Models & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Storage
  flutter_secure_storage: ^10.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cached_network_image: ^3.3.0
  cached_network_image_platform_interface: ^4.0.0
  shimmer: ^3.0.0
  flutter_dotenv: ^6.0.1
  meta: ^1.11.0

  # i18n
  slang: ^4.0.0
  slang_flutter: ^4.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  slang_build_runner: ^4.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  coverage: ^1.15.0
  freezed: ^3.2.5
  json_serializable: ^6.7.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4
  alchemist: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.qa
    - assets/
