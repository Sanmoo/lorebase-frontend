name: lorebase
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0
  url_strategy: ^0.3.0

  # HTTP
  dio: ^5.4.0

  # Auth
  amplify_flutter: ^1.6.0
  amplify_auth_cognito: ^1.6.0

  # Models & Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Storage
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cached_network_image: ^3.3.0
  cached_network_image_platform_interface: ^4.0.0
  shimmer: ^3.0.0
  flutter_dotenv: ^5.1.0
  meta: ^1.11.0

  # i18n
  slang: ^4.0.0
  slang_flutter: ^4.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  slang_build_runner: 4.11.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.0
  build_runner: ^2.4.0
  coverage: ^1.15.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  riverpod_lint: ^2.3.0
  custom_lint: ^0.7.0
  flutter_launcher_icons: ^0.13.1
  alchemist: ^0.11.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
